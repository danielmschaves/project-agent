# Entity registry — people.
#
# The compiler resolves names through this file and nothing else: a plain
# dictionary lookup, so the same corpus always produces the same articles.
# `pipeline lint` reports names it could not resolve and proposes additions
# here; a human merges them, which keeps entity resolution behind the HITL
# gate instead of inside the compiler.
#
# Shape:
#   <slug>:
#     name: Bob Kim
#     aliases: ["Bob Kim", "B. Kim", "bob.kim@example.com"]
#     projects: [acme--platform-2026]

alice-chen:
  name: Alice Chen
  aliases: ["Alice", "alice.chen@example.com", "alice.chen@company.com"]
  projects: [demo--sample-2026]
bob-kim:
  name: Bob Kim
  aliases: ["Bob", "B. Kim", "bob.kim@example.com"]
  projects: [demo--sample-2026]
carol-davis:
  name: Carol Davis
  aliases: ["Carol", "carol.davis@example.com"]
  projects: [demo--sample-2026]
dave-park:
  name: Dave Park
  aliases: ["Dave", "dave.park@example.com", "dave.park@partnerA.com"]
  projects: [demo--sample-2026]
