[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-agent"
version = "0.1.0"
description = "A git-versioned, AI-augmented project operating system"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "duckdb>=1.1.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.0",
    "python-frontmatter>=1.1.0",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure-function tests, no I/O",
    "integration: touches filesystem, DuckDB, or git",
    "idempotence: runs a stage twice, asserts second run is a no-op",
    "boundary: package-boundary lint",
]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["tests/"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
