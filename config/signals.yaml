# LLM spend cap, per project per day, in USD.
#
# One cap covers the whole run, not one per stage: the compile stage draws on
# it first for article prose, and passes what it spent to the analyze stage so
# the LLM signal detectors see the remaining headroom. Whichever runs out
# degrades gracefully — compile falls back to deterministic templates, analyze
# emits a pipeline_health event and skips its remaining detectors.
#
# Cached responses are free and are always replayed, even at zero budget, so
# hitting the cap never regresses work that is already done.
#
# 0.0 disables all LLM calls: the pipeline runs deterministic-only.
llm_cost_cap_usd_per_project_per_day: 0.50
